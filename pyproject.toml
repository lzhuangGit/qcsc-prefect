[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcsc-prefect-workspace"
version = "0.0.0"
description = "Monorepo workspace for HPC + Prefect integration"
readme = "docs/concept.md"
requires-python = ">=3.11"
dependencies = []

# This project itself is not intended for distribution
# (running `pip install .` on it is meaningless)
dynamic = []

# Development tools (installed by default with `uv sync`)
[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned exactly so that CI and local pre-commit produce identical results
    "ruff==0.16.9",
]

[tool.setuptools]
packages = []

# -----------------------------
# Workspace / Monorepo settings
# -----------------------------

# --- uv ---
[tool.uv.workspace]
members = [
    "packages/qcsc-prefect",
    "packages/qcsc-prefect-core",
    "packages/qcsc-prefect-adapters",
    "packages/qcsc-prefect-blocks",
    "packages/qcsc-prefect-executor",
    "packages/qcsc-prefect-dice",
    "packages/qcsc-prefect-qiskit",
]


[tool.uv.sources]
qcsc-prefect          = { workspace = true }
qcsc-prefect-core     = { workspace = true }
qcsc-prefect-adapters = { workspace = true }
qcsc-prefect-blocks   = { workspace = true }
qcsc-prefect-executor = { workspace = true }
qcsc-prefect-dice     = { workspace = true }
qcsc-prefect-qiskit   = { workspace = true }

# --- Poetry ---
[tool.poetry]
name = "qcsc-prefect-workspace"
version = "0.0.0"
description = "Monorepo workspace for HPC + Prefect integration"
authors = ["HPC Team"]
packages = []

[tool.poetry.dependencies]
python = ">=3.11"

[tool.poetry.workspace]
members = [
    "packages/qcsc-prefect",
    "packages/qcsc-prefect-core",
    "packages/qcsc-prefect-adapters",
    "packages/qcsc-prefect-blocks",
    "packages/qcsc-prefect-executor",
    "packages/qcsc-prefect-dice",
    "packages/qcsc-prefect-qiskit",
]

# --- Hatch ---
[tool.hatch.workspace]
members = [
    "packages/qcsc-prefect",
    "packages/qcsc-prefect-core",
    "packages/qcsc-prefect-adapters",
    "packages/qcsc-prefect-blocks",
    "packages/qcsc-prefect-executor",
    "packages/qcsc-prefect-dice",
    "packages/qcsc-prefect-qiskit",
]

# -----------------------------
# Shared development tool settings (optional)
# -----------------------------

[tool.pytest.ini_options]
testpaths = [
    "packages",
]
addopts = "-ra"
markers = [
    "miyabi_integration: tests that require Miyabi login node and real qsub/qstat",
    "fugaku_integration: tests that require Fugaku login node and real pjsub/pjstat",
    "kind_integration: tests that require kind + Docker and pass --kind to pytest",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Match the pre-commit hook scope (types_or: [python, pyi])
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_return_any = true
ignore_missing_imports = true
