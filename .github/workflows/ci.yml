name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install lint tools
        run: uv sync --only-group dev

      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format
        run: uv run --no-sync ruff format --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workspace packages
        run: uv sync --all-packages

      - name: Run pytest
        run: uv run --no-sync pytest

  kind:
    name: Kind integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install workspace packages (with kubernetes extra)
        run: uv sync --all-packages --extra kubernetes

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run kind integration tests
        run: |
          uv run --no-sync pytest \
            packages/qcsc-prefect-adapters/tests/test_kubernetes_kind.py \
            --kind -v \
            -m kind_integration

  # Single required status check for branch protection, independent of the matrix.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - lint
      - test
      - kind
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
