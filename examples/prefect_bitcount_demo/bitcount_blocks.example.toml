# Target system: "miyabi", "fugaku", or "kubernetes"
hpc_target = "miyabi"
# Miyabi uses project. Fugaku also accepts legacy project, but tutorials prefer `group = "ra000000"`.
# Kubernetes does not require project or queue.
project = "gz00"
# group = "ra000000"
queue = "regular-c" # Miyabi queue, or Fugaku rscgrp (e.g. "small")
work_dir = "/work/${GROUP:gz00}/${USER}/miyabi_tutorial"

# Everything below is optional.
# If omitted, create_blocks.py uses built-in defaults.
# launcher = "mpiexec.hydra"  # Miyabi default; Fugaku default is "mpiexec"
# walltime = "00:15:00"
# num_nodes = 2
# mpiprocs = 5
# ompthreads = 1
# shots = 100000
# modules = ["intel/2023.2.0", "impi/2021.10.0"]  # Miyabi-oriented defaults
# mpi_options = []
#
# For a cross-HPC demo, prefer target-specific execution profiles such as:
# execution_profile_block_name = "exec-bitcount-miyabi"
# execution_profile_block_name = "exec-bitcount-fugaku"
# execution_profile_block_name = "exec-bitcount-k8s"
#
# If the execution recipe is truly identical on both systems, you may reuse one
# shared ExecutionProfileBlock, for example:
# launcher = "mpiexec"
# modules = []

# Optional Fugaku-specific settings (used only when hpc_target = "fugaku")
# fugaku_gfscache = "/vol0002"
# fugaku_spack_modules = ["fj", "fjmpi"]
# fugaku_mpi_options_for_pjm = ["max-proc-per-node=4"]

# Optional Kubernetes-specific settings (used only when hpc_target = "kubernetes")
# kubernetes_image = "qcsc-hpc-base:latest"
# kubernetes_namespace = "default"
# kubernetes_work_volume_claim = "qcsc-shared-pvc"
# kubernetes_work_mount_path = "/data/qcsc-prefect"
# kubernetes_cpu = "2"
# kubernetes_memory = "4Gi"

# Optional executable override
# optimized_executable = "/work/gz00/<user>/miyabi_tutorial/get_counts_hist"
# optimized_executable = "/vol0001/home/<user>/prefect_bitcount_demo/bin/get_counts_hist"
# optimized_executable = "/data/qcsc-prefect/examples/prefect_bitcount_demo/bin/get_counts_hist"

# Optional naming overrides
# command_block_name = "cmd-bitcount-hist"
# execution_profile_block_name = "exec-bitcount-mpi"       # Miyabi default name
# execution_profile_block_name = "exec-bitcount-fugaku"    # Fugaku suggested name
# execution_profile_block_name = "exec-bitcount-k8s"       # Kubernetes default name
# hpc_profile_block_name = "hpc-miyabi-bitcount"           # Miyabi default name
# hpc_profile_block_name = "hpc-fugaku-bitcount"           # Fugaku suggested name
# hpc_profile_block_name = "hpc-k8s-bitcount"              # Kubernetes default name
# options_variable_name = "miyabi-bitcount-options"        # Miyabi default name
# options_variable_name = "fugaku-bitcount-options"        # Fugaku suggested name
# options_variable_name = "k8s-bitcount-options"           # Kubernetes default name
#
# Shared-name example for a merged demo:
# options_variable_name = "bitcount-options"
#
# For a flow_optimized.py demo, switch the execution/HPC profile pair at
# runtime. If you want a common base directory, either keep `work_dir`
# identical in both target configs or pass a shared --work-dir when running.

# Legacy tutorial-style settings (opt-in; not created by default)
# create_legacy_tutorial_assets = true
# bitcounter_block_name = "miyabi-tutorial"
# tutorial_variable_name = "miyabi-tutorial"
#
# Shared-name example for a merged demo:
# bitcounter_block_name = "bitcount-tutorial"
# tutorial_variable_name = "bitcount-tutorial"
